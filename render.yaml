services:
  - type: web
    name: sohbet-app
    runtime: node
    plan: free
    # Repo'nun kökünde package.json yoksa (ör. her şey "sohbet-app" klasörünün içindeyse) şunu aç:
    # rootDir: sohbet-app
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Veriler GitHub deposundaki "veri" dalına yedeklenir (ücretsiz). Depo PRIVATE (özel) olmalı!
      - key: GITHUB_TOKEN        # GitHub'da oluşturduğun token (Contents: Read and write)
        sync: false
      - key: GITHUB_REPO         # kullanici/repo-adi
        sync: false
      # İsteğe bağlı: ayrı medya ve Reels depoları. Boş bırakılırsa ilk depo kullanılır.
      - key: GITHUB_REPO_MEDIA  # kullanici/sohbet-medya
        sync: false
      - key: GITHUB_REPO_REELS  # kullanici/sohbet-reels
        sync: false
      # İsteğe bağlı: aramalar için TURN sunucusu
      - key: TURN_URL
        sync: false
      - key: TURN_USER
        sync: false
      - key: TURN_PASS
        sync: false

      # Web Push bildirimleri (isteğe bağlı; VAPID anahtarları npx web-push generate-vapid-keys ile üretilir)
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
